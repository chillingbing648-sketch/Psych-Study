<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">PsychStudy AI — Psychology Study Companion</title><desc id="desc">A light pastel product overview faithfully inspired by the PsychStudy AI interface: navigation, study companion hero, topic statistics, curriculum cards, daily psychology fact, PDF import, notes, flashcards, quiz and exam paper workflows, plus the actual technology stack.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F7FF"/><stop offset=".55" stop-color="#F4F1FF"/><stop offset="1" stop-color="#EEF6FF"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C6BE8"/><stop offset="1" stop-color="#9B8AF2"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#6B63A0" flood-opacity=".12"/></filter><style>.u{font-family:Arial,Inter,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.t{fill:#1C1537}.m{fill:#6B63A0}.lav{fill:#7C6BE8}.mint{fill:#34D399}</style></defs><rect width="1600" height="900" rx="34" fill="url(#bg)"/><rect x="34" y="30" width="1532" height="840" rx="30" fill="#FFFFFF" filter="url(#shadow)"/><rect x="34" y="30" width="1532" height="62" rx="30" fill="#FFFFFF"/><line x1="34" y1="92" x2="1566" y2="92" stroke="#E9E5F8"/><g class="u"><text x="68" y="70" class="serif lav" font-size="22" font-weight="700">🧠 PsychStudy<tspan font-family="Arial" font-size="11" letter-spacing="1"> AI</tspan></text><text x="310" y="69" class="m" font-size="13">Dashboard</text><text x="400" y="69" class="m" font-size="13">Study</text><text x="470" y="69" class="m" font-size="13">Flashcards</text><text x="575" y="69" class="m" font-size="13">My Notes</text><text x="675" y="69" class="m" font-size="13">Quiz</text><text x="736" y="69" class="m" font-size="13">Exam Paper</text><rect x="1378" y="45" width="92" height="32" rx="10" fill="#EDE9FF"/><text x="1424" y="66" text-anchor="middle" class="lav" font-size="12" font-weight="700">Import PDF</text><circle cx="1518" cy="61" r="16" fill="#EDE9FF"/><text x="1518" y="66" text-anchor="middle" class="lav" font-size="14">☾</text></g><g class="u"><rect x="58" y="116" width="1484" height="245" rx="28" fill="url(#hero)"/><rect x="90" y="150" width="300" height="28" rx="14" fill="#FFFFFF" fill-opacity=".16"/><text x="240" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1FF" letter-spacing="1">🎓 PSYCHOLOGY OF ADJUSTMENT · UNIVERSITY EDITION</text><text x="90" y="230" font-size="46" font-weight="800" fill="#FFFFFF">Psychology</text><text x="90" y="275" class="serif" font-size="46" font-weight="700" font-style="italic" fill="#FFFFFF">Study Companion</text><text x="90" y="307" font-size="15" fill="#F5F1FF">Learn, revise, and master psychology concepts with structured study tools.</text><rect x="90" y="326" width="128" height="14" rx="7" fill="#FFFFFF" fill-opacity=".18"/><rect x="90" y="326" width="87" height="14" rx="7" fill="#FFFFFF" fill-opacity=".72"/><circle cx="1320" cy="237" r="92" fill="#FFFFFF" fill-opacity=".10"/><circle cx="1320" cy="237" r="66" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2"/><circle cx="1320" cy="237" r="42" fill="#FFFFFF" fill-opacity=".13"/><text x="1320" y="250" text-anchor="middle" font-size="55">🧠</text><text x="1180" y="178" fill="#FFFFFF" fill-opacity=".9" font-size="12">GAD</text><text x="1422" y="210" fill="#FFFFFF" fill-opacity=".9" font-size="12">OCD</text><text x="1172" y="300" fill="#FFFFFF" fill-opacity=".9" font-size="12">CBT</text><text x="1405" y="305" fill="#FFFFFF" fill-opacity=".9" font-size="12">DSM-5</text></g><g class="u"><rect x="58" y="382" width="1484" height="76" rx="20" fill="#F9F8FF" stroke="#E9E5F8"/><text x="150" y="414" text-anchor="middle" class="t" font-size="28" font-weight="800">22</text><text x="150" y="438" text-anchor="middle" class="m" font-size="12">Topics</text><line x1="290" y1="401" x2="290" y2="440" stroke="#DDD8F0"/><text x="430" y="414" text-anchor="middle" class="t" font-size="28" font-weight="800">0</text><text x="430" y="438" text-anchor="middle" class="m" font-size="12">My Notes</text><line x1="570" y1="401" x2="570" y2="440" stroke="#DDD8F0"/><text x="710" y="414" text-anchor="middle" class="t" font-size="28" font-weight="800">0</text><text x="710" y="438" text-anchor="middle" class="m" font-size="12">Studied</text><line x1="850" y1="401" x2="850" y2="440" stroke="#DDD8F0"/><text x="990" y="414" text-anchor="middle" class="t" font-size="28" font-weight="800">0</text><text x="990" y="438" text-anchor="middle" class="m" font-size="12">Quizzes Done</text><rect x="1110" y="400" width="368" height="39" rx="12" fill="#EDE9FF"/><text x="1294" y="425" text-anchor="middle" class="lav" font-size="12" font-weight="700">Learn → Revise → Practice → Test</text></g><g class="u"><text x="64" y="500" class="m" font-size="10" font-weight="800" letter-spacing="2">CURRICULUM TOPICS</text><text x="64" y="532" class="t" font-size="24" font-weight="800">Browse All Topics</text><rect x="64" y="550" width="352" height="96" rx="18" fill="#FFFFFF" stroke="#ECE8F7"/><text x="88" y="582" font-size="25">🏥</text><text x="128" y="580" class="t" font-size="15" font-weight="700">Psychological Disorders</text><text x="128" y="603" class="m" font-size="11">Foundations · Definition · 4 Ds · DSM</text><rect x="438" y="550" width="352" height="96" rx="18" fill="#FFFFFF" stroke="#ECE8F7"/><text x="462" y="582" font-size="25">🌍</text><text x="502" y="580" class="t" font-size="15" font-weight="700">Culture &amp; Mental Health</text><text x="502" y="603" class="m" font-size="11">Context · Culture-bound syndromes · stigma</text><rect x="812" y="550" width="352" height="96" rx="18" fill="#FFFFFF" stroke="#ECE8F7"/><text x="836" y="582" font-size="25">🧠</text><text x="876" y="580" class="t" font-size="15" font-weight="700">Deep Study Mode</text><text x="876" y="603" class="m" font-size="11">Exam-level explanations · key points · examples</text><rect x="1186" y="550" width="356" height="96" rx="18" fill="#FFFFFF" stroke="#ECE8F7"/><text x="1210" y="582" font-size="25">🃏</text><text x="1250" y="580" class="t" font-size="15" font-weight="700">Revision &amp; Practice</text><text x="1250" y="603" class="m" font-size="11">Flashcards · quizzes · exam paper</text><rect x="64" y="670" width="730" height="112" rx="20" fill="#FFF" stroke="#ECE8F7"/><circle cx="106" cy="726" r="26" fill="#EDE9FF"/><text x="106" y="736" text-anchor="middle" font-size="25">💡</text><text x="150" y="707" class="lav" font-size="10" font-weight="800" letter-spacing="1.6">DAILY PSYCHOLOGY FACT</text><text x="150" y="735" class="t" font-size="16" font-weight="700">Culture shapes how distress is understood.</text><text x="150" y="758" class="m" font-size="12">A compact learning prompt keeps the dashboard useful beyond revision sessions.</text><rect x="820" y="670" width="722" height="112" rx="20" fill="#F9F8FF" stroke="#E9E5F8"/><text x="852" y="707" class="lav" font-size="10" font-weight="800" letter-spacing="1.6">BRING YOUR OWN MATERIAL</text><text x="852" y="735" class="t" font-size="18" font-weight="800">📥 Import a Psychology PDF</text><text x="852" y="758" class="m" font-size="12">PDF.js extracts text in-browser, then stores the imported study text locally for the study workflow.</text><rect x="1358" y="720" width="146" height="36" rx="10" fill="#7C6BE8"/><text x="1431" y="743" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Choose PDF</text></g><rect x="58" y="805" width="1484" height="38" rx="12" fill="#F0EDFF"/><g class="u"><text x="82" y="829" class="lav" font-size="10" font-weight="800" letter-spacing="1.3">STACK</text><text x="140" y="829" class="t" font-size="11">HTML5</text><circle cx="205" cy="825" r="2" fill="#B7AFD6"/><text x="224" y="829" class="t" font-size="11">CSS3</text><circle cx="287" cy="825" r="2" fill="#B7AFD6"/><text x="306" y="829" class="t" font-size="11">JavaScript</text><circle cx="393" cy="825" r="2" fill="#B7AFD6"/><text x="412" y="829" class="t" font-size="11">PDF.js 3.11.174</text><circle cx="540" cy="825" r="2" fill="#B7AFD6"/><text x="559" y="829" class="t" font-size="11">localStorage</text><circle cx="675" cy="825" r="2" fill="#B7AFD6"/><text x="694" y="829" class="t" font-size="11">Poppins</text><circle cx="770" cy="825" r="2" fill="#B7AFD6"/><text x="789" y="829" class="t" font-size="11">Playfair Display</text><circle cx="943" cy="825" r="2" fill="#B7AFD6"/><text x="962" y="829" class="t" font-size="11">File API</text><circle cx="1040" cy="825" r="2" fill="#B7AFD6"/><text x="1059" y="829" class="t" font-size="11">ArrayBuffer</text><circle cx="1164" cy="825" r="2" fill="#B7AFD6"/><text x="1183" y="829" class="t" font-size="11">Print API</text><text x="1514" y="829" text-anchor="end" class="m" font-size="10">Vanilla web app · no build step required</text></g></svg>